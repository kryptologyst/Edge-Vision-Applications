# Device-specific configurations for Edge Vision Applications

# Raspberry Pi 4B Configuration
device:
  name: "raspberry_pi_4b"
  platform: "arm64"
  cpu_cores: 4
  memory_gb: 4
  storage_gb: 32
  inference_backend: "tflite"
  optimization_level: "high"
  enable_gpu: false
  enable_tpu: false
  
# Camera settings
camera:
  resolution: [640, 480]
  fps: 30
  format: "RGB"
  
# Performance constraints
constraints:
  max_latency_ms: 100
  target_fps: 15
  max_memory_mb: 512
  max_power_watts: 5.0
  
# Model settings
model:
  input_size: [224, 224]
  batch_size: 1
  precision: "int8"
  enable_quantization: true
  
# Logging
logging:
  level: "INFO"
  enable_performance_logging: true
  log_interval_frames: 30
